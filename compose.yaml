# Usage: docker compose up -d --build   →  http://localhost:4317
#
# Optional env (shell or a .env file next to this file):
#   KM_PORT=4317                  host port
#   KM_PUBLISH_ADDR=127.0.0.1     set to 0.0.0.0 to reach it from your phone on the LAN
#   KM_ALLOWED_HOSTS=192.168.1.20 required with 0.0.0.0: the PC's LAN IP / hostname
#
# Sign-in (on by default): KM_TOTP_SECRET from the same .env, created on the
# host with `npm run auth:setup`. KM_AUTH=off turns it off (local only).
services:
  km:
    build: .
    image: knowledge-manager:local
    container_name: knowledge-manager
    init: true # proper signal handling / zombie reaping for node as PID 1
    restart: unless-stopped
    ports:
      - '${KM_PUBLISH_ADDR:-127.0.0.1}:${KM_PORT:-4317}:4317'
    environment:
      KM_ALLOWED_HOSTS: ${KM_ALLOWED_HOSTS:-}
      KM_LOG_LEVEL: ${KM_LOG_LEVEL:-info}
      KM_AUTH: ${KM_AUTH:-totp}
      KM_TOTP_SECRET: ${KM_TOTP_SECRET:-}
      KM_SESSION_HOURS: ${KM_SESSION_HOURS:-168}
      KM_COOKIE_SECURE: ${KM_COOKIE_SECURE:-false}
      KM_HUB: ${KM_HUB:-off}
      KM_HUB_KEEP_VERSIONS: ${KM_HUB_KEEP_VERSIONS:-100}
      # Backups / markdown exports ("Backup Now" in the app). Default /data/backups is
      # inside the volume, so `docker compose down -v` deletes them too. To keep them on
      # the host, uncomment both lines below (the host folder must be writable by uid 1000).
      # KM_BACKUP_DIR: /backups
    volumes:
      - km-data:/data
      # - ${KM_BACKUP_HOST_DIR:-./backups}:/backups

volumes:
  km-data:
    name: knowledge-manager-data
